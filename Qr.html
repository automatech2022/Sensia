<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sensia Web - Vincular</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --sensia-primary: #7BA0A8; --sensia-bg: #F8F9FA; }
        body { font-family: sans-serif; background: var(--sensia-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: var(--sensia-primary); }
        #qrcode { margin: 20px auto; padding: 10px; border: 2px solid var(--sensia-primary); border-radius: 12px; display: inline-block; min-width: 200px; min-height: 200px; }
        .error { color: #e74c3c; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-container" class="container">
        <h1>Sensia Web</h1>
        <p>Escanea para sincronizar</p>
        <div id="qrcode"></div>
        <div id="status" style="font-size: 14px; color: #666;">Iniciando...</div>
        <div id="debug-error" class="error"></div>
    </div>

    <script>
        // ASEGÚRATE QUE ESTA URL NO TENGA "/" AL FINAL
        const API_URL = "https://sensia-api.automatech2022.workers.dev"; 
        const sessionToken = "SN-" + Math.random().toString(36).substr(2, 9).toUpperCase();

        async function generateQR() {
            const status = document.getElementById("status");
            const debug = document.getElementById("debug-error");

            try {
                status.innerText = "Registrando sesión en la nube...";
                
                // 1. Llamada al Worker
                const response = await fetch(`${API_URL}/create-web-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: sessionToken })
                });

                if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);

                // 2. Generar el QR
                status.innerText = "Generando código...";
                document.getElementById("qrcode").innerHTML = ""; // Limpiar
                new QRCode(document.getElementById("qrcode"), {
                    text: sessionToken,
                    width: 200,
                    height: 200,
                    colorDark : "#7BA0A8",
                    colorLight : "#ffffff"
                });

                status.innerText = "¡Listo! Escanea con tu app.";
                startPolling();

            } catch (err) {
                status.innerText = "Error de conexión";
                debug.innerText = err.message;
                console.error("Error completo:", err);
            }
        }

        function startPolling() {
            setInterval(async () => {
                try {
                    const res = await fetch(`${API_URL}/check-session`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: sessionToken })
                    });
                    const data = await res.json();
                    if (data.status === 'authorized') {
                        alert("¡Sesión autorizada para: " + data.user_email + "!");
                        window.location.reload(); // Por ahora recargamos
                    }
                } catch (e) { /* Esperando... */ }
            }, 3000);
        }

        window.onload = generateQR;
    </script>
</body>
</html>
